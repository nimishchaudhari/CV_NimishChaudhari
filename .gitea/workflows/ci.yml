name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to pages branch
        run: |
          git config user.name "gitea-pages"
          git config user.email "actions@gitea.com"
          git checkout --orphan pages || git checkout pages
          git rm -rf .
          cp -r dist/* .
          git add .
          git commit -m "build: deploy pages" || exit 0
          git push origin pages --force
